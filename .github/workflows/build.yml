name: Compilar HOTSPOT ADV UNIVERSAL

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Compilar firmware
        run: pio run -e m5stack-cardputer

      - name: Publicar BIN como artefato
        uses: actions/upload-artifact@v4
        with:
          name: hotspot-adv-universal-firmware
          path: .pio/build/m5stack-cardputer/firmware.bin
          if-no-files-found: error
          retention-days: 30

      - name: Anexar BIN à Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: .pio/build/m5stack-cardputer/firmware.bin
